[pytest]
# pytest 只收集 tests/ 下规范的 test_*.py 用例（conftest.py 已把平台根加进
# sys.path）。tests/ 里还有大量以 _ 开头的脚本式守卫/集成探针
# （_check_*/_it_*/_audit_*/_route_inventory 等），它们由 tests/_run_all.py
# 统一调度（超时、互斥锁、--quick 慢速分流），不被 pytest 收集。
# 显式写死 python_files 而不是依赖默认值：将来默认规则变化时也不会误收脚本。
testpaths = tests
python_files = test_*.py
