<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="vp-lang" content="{{ lang }}">
<title>使用手册 - 植物病毒分析平台</title>
<script>try{if(localStorage.getItem("vp_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
<style>
  .doc { background:#fff; border-radius:12px; padding:26px 32px;
         box-shadow:0 1px 5px rgba(20,50,30,.08); max-width:1000px;
         margin:0 auto; font-size:14px; line-height:1.75; }
  .doc pre { white-space:pre-wrap; word-break:break-all; background:#f6f9f7;
             border:1px solid #e3e8ee; border-radius:8px; padding:12px 14px;
             font-size:12.5px; overflow:auto; }
  .doc h2:first-child, .doc h1 { margin-top:0; }
  .doc p { margin:6px 0; }
  .doc ul, .doc ol { margin:8px 0; }
  .doc li { margin:3px 0; }
  .doc a { color:#2c7a4b; }
  .doc a:hover { text-decoration:underline; }
  .doc table { border-collapse:collapse; }
  .doc code { background:#f1f5f2; border:1px solid #e3e8ee; border-radius:4px;
              padding:1px 5px; font-size:12.5px;
              font-family:ui-monospace,Consolas,monospace; }
  /* 功能全景树（feature-tree.js 渲染） */
  .vp-ftree { border:1px solid #dbe7e0; border-radius:10px; padding:10px 12px;
              margin:0 0 18px; background:#fbfdfc; }
  .vp-ftree-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap;
                  margin-bottom:6px; }
  .vp-ftree-count { font-size:12px; color:#5a6f61; }
  .vp-ftree-q { flex:1 1 180px; min-width:150px; padding:4px 9px; font-size:12.5px;
                border:1px solid #cfe0d5; border-radius:7px; }
  .vp-ftree-bar button { font-size:12px; padding:4px 10px; border-radius:7px;
                         border:1px solid #cfe0d5; background:#fff; cursor:pointer; }
  .vp-ftree-bar button:hover { background:#eef6f0; }
  .vp-ftree-list, .vp-ftree-items { list-style:none; margin:0; padding:0; }
  .vp-ftree-grow { display:flex; align-items:center; gap:7px; padding:6px 8px;
                   border-radius:8px; cursor:pointer; user-select:none; }
  .vp-ftree-grow:hover { background:#eef6f0; }
  .vp-ftree-g.open > .vp-ftree-grow { background:#e7f2ea; }
  .vp-ftree-arrow { width:12px; color:#4b7a5c; font-size:11px; }
  .vp-ftree-gicon { font-size:15px; }
  .vp-ftree-grow b { font-size:13.5px; color:#14532d; }
  .vp-ftree-gn { margin-left:auto; font-size:11px; color:#7d9384;
                 background:#eaf2ec; border-radius:99px; padding:1px 8px; }
  .vp-ftree-items { padding:2px 0 6px 30px; }
  .vp-ftree-item a { display:block; padding:4px 8px; font-size:13px;
                     color:#2c5e43; text-decoration:none; border-radius:7px; }
  .vp-ftree-item a:hover { background:#eef6f0; text-decoration:underline; }
</style>
</head>
<body>
{% include "_nav.html" %}
<div class="page">
  <div class="doc">
    <h1 style="margin-top:0" data-i18n="hlp.title">📖 使用手册</h1>
    <div id="vp-ftree-box"></div>
    <div id="md"></div>
  </div>
</div>
<script src="/static/i18n.js?v={{ asset_v }}"></script>
<script src="/static/feature-tree.js?v={{ asset_v }}"></script>
<script src="/static/app.js?v={{ asset_v }}"></script>
  <script src="/static/app-compare.js?v={{ asset_v }}"></script>
  <script src="/static/app-runhistory.js?v={{ asset_v }}"></script>
  <script src="/static/app-jobs.js?v={{ asset_v }}"></script>
  <script src="/static/app-browse.js?v={{ asset_v }}"></script>
  <script src="/static/app-batch.js?v={{ asset_v }}"></script>
  <script src="/static/app-storage.js?v={{ asset_v }}"></script>
<script src="/static/examples.js?v={{ asset_v }}"></script>
<script>
  // 功能全景树（数据源 feature-tree.js，节点可点跳对应工具卡）
  if (window.VPFeatureTree) VPFeatureTree.render('vp-ftree-box');

  // Markdown 渲染（覆盖 README.md 实际语法：标题/粗斜体/行内码/链接/图片
  // 徽章/有序无序列表/表格/代码块/引用/分隔线/<details> 折叠块/装饰性
  // HTML 包装行与 <br>、<b> 白名单标签）。先整体转义，再按块解析。
  (function () {
    const RAW = {{ text | tojson }};
    // 与 app.js 的 esc 同一口径：连引号一起转义（属性上下文也安全）
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    // 行内元素：粗体 → 行内码 → 链接 → 斜体（顺序重要，粗体先于斜体）
    function inline(s) {
      let t = esc(s);
      // 行内码（优先，内部不再解析）
      t = t.replace(/`([^`]+)`/g, (m, c) =>
        '<code style="background:#f1f5f2;border:1px solid #e3e8ee;border-radius:4px;' +
        'padding:1px 5px;font-size:12.5px;font-family:ui-monospace,Consolas,monospace">' + c + '</code>');
      // 粗体
      t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      // 斜体（避开已生成的标签属性）
      t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      // 图片 ![alt](url)：先于链接解析（否则 `!` 落单，README 头部徽章
      // 会变成「!Platform」假链接）。只放行 https 外链（shields 徽章）；
      // 加载失败（离线）整只隐藏，非外链/相对路径退化为 alt 文本。
      t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, url) => {
        if (!/^https:\/\//i.test(url)) return alt;
        return '<img src="' + url + '" alt="' + esc(alt) + '" loading="lazy" ' +
               'style="display:inline-block;height:20px;margin:2px 3px;' +
               'vertical-align:middle" onerror="this.style.display=\'none\'">';
      });
      // 链接 [text](url)：只放行 http(s)/mailto/站内锚点，堵 javascript: 协议
      t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, txt, url) => {
        const ok = /^(https?:\/\/|mailto:|\/|#)/i.test(url);
        return '<a href="' + (ok ? url : '#') + '" target="_blank" rel="noopener">' + txt + '</a>';
      });
      // README 允许少量装饰性 HTML（2026-10 头部改版：<br/>、<details> 折叠
      // 块、<b> 直接出现在正文）。整体转义后仅还原这只白名单标签，其余
      // 标签维持转义原样显示——安全口径不变。
      t = t.replace(/&lt;(\/?)(details|summary|b|kbd|sub|sup)([^&]*?)&gt;/g, '<$1$2$3>');
      t = t.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
      return t;
    }

    const lines = RAW.split(/\r?\n/);

    // 跨行粗体：把「未闭合的 **」与后续行的「**」合并到同一行，
    // 避免逐行渲染时成对标记被拆开（README.md 有 12 处这种写法，其中一处跨 3 行含空行）。
    for (let k = 0; k + 1 < lines.length; k++) {
      const c = (lines[k].match(/\*\*/g) || []).length;
      if (c % 2 === 1) {
        // 向后找下一个也含奇数个 ** 的非空行，把中间内容一并并入
        for (let j = k + 1; j < lines.length; j++) {
          const cj = (lines[j].match(/\*\*/g) || []).length;
          if (cj % 2 === 1) {
            const merged = [lines[k]];
            for (let t = k + 1; t <= j; t++) if (lines[t].trim()) merged.push(lines[t].trim());
            lines[k] = merged.join(' ');
            lines.splice(k + 1, j - k);
            k--;
            break;
          }
          // 遇到标题或围栏就停止，不跨界合并
          if (/^\s*(#|```)/.test(lines[j])) break;
        }
      }
    }

    const out = [];
    let i = 0;

    while (i < lines.length) {
      const l = lines[i];

      // 代码围栏 ``` ... ```
      if (/^\s*```/.test(l)) {
        const lang = l.replace(/^\s*```/, '').trim();
        const buf = [];
        i++;
        while (i < lines.length && !/^\s*```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++; // 跳过收尾围栏
        out.push('<pre' + (lang ? ' data-lang="' + esc(lang) + '"' : '') + '>' +
                 esc(buf.join('\n')) + '</pre>');
        continue;
      }

      // 表格：当前行含 | 且下一行是分隔行 |---|---|
      if (/\|/.test(l) && i + 1 < lines.length && /^\s*\|?[\s:-]*\|[\s:|-]*$/.test(lines[i + 1])) {
        const cells = s => s.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        const head = cells(l);
        i += 2;
        const rows = [];
        while (i < lines.length && /\|/.test(lines[i]) && lines[i].trim()) {
          rows.push(cells(lines[i])); i++;
        }
        let h = '<div class="doc-tbl-wrap" style="overflow-x:auto;margin:12px 0">' +
                '<table class="tbl" style="width:100%;border-collapse:collapse;font-size:13px">' +
                '<thead><tr>' +
                head.map(c => '<th style="border:1px solid #d9e2dc;background:#f6f9f7;' +
                              'padding:7px 10px;text-align:left">' + inline(c) + '</th>').join('') +
                '</tr></thead><tbody>';
        rows.forEach(r => {
          h += '<tr>' + r.map(c => '<td style="border:1px solid #d9e2dc;padding:7px 10px">' +
                                    inline(c) + '</td>').join('') + '</tr>';
        });
        out.push(h + '</tbody></table></div>');
        continue;
      }

      // 标题
      if (/^####? /.test(l)) { out.push('<h3>' + inline(l.replace(/^#+ /, '')) + '</h3>'); i++; continue; }
      if (/^### /.test(l))   { out.push('<h3>' + inline(l.slice(4)) + '</h3>'); i++; continue; }
      if (/^## /.test(l)) {
        out.push('<h2 style="color:#14532d;border-left:4px solid #2c7a4b;' +
                 'padding-left:10px;margin-top:26px">' + inline(l.slice(3)) + '</h2>');
        i++; continue;
      }
      if (/^# /.test(l)) {
        out.push('<h1 style="color:#14532d;margin-top:0">' + inline(l.slice(2)) + '</h1>');
        i++; continue;
      }

      // 无序列表（连续多项合并为一个 <ul>）
      if (/^\s*[-*+] /.test(l)) {
        const items = [];
        while (i < lines.length && /^\s*[-*+] /.test(lines[i])) {
          items.push(inline(lines[i].replace(/^\s*[-*+] /, ''))); i++;
        }
        out.push('<ul style="margin:8px 0;padding-left:22px">' +
                 items.map(x => '<li style="margin:3px 0">' + x + '</li>').join('') + '</ul>');
        continue;
      }

      // 有序列表
      if (/^\s*\d+\. /.test(l)) {
        const items = [];
        while (i < lines.length && /^\s*\d+\. /.test(lines[i])) {
          items.push(inline(lines[i].replace(/^\s*\d+\. /, ''))); i++;
        }
        out.push('<ol style="margin:8px 0;padding-left:24px">' +
                 items.map(x => '<li style="margin:3px 0">' + x + '</li>').join('') + '</ol>');
        continue;
      }

      // 引用
      if (/^> /.test(l)) {
        const buf = [];
        while (i < lines.length && /^> ?/.test(lines[i])) {
          buf.push(inline(lines[i].replace(/^> ?/, ''))); i++;
        }
        out.push('<blockquote style="border-left:3px solid #cfe0d5;background:#f8fbf9;' +
                 'margin:10px 0;padding:8px 14px;color:#4b5a50">' +
                 buf.join('<br>') + '</blockquote>');
        continue;
      }

      // 分隔线
      if (/^\s*([-*_])\1{2,}\s*$/.test(l)) { out.push('<hr style="border:0;border-top:1px solid #e3e8ee;margin:20px 0">'); i++; continue; }

      // GitHub 装饰性包装行（<div align="center"> / </div>）：居中排版只在
      // 仓库页面有意义，直接丢弃，不渲染也不显形
      if (/^\s*<\/?div[^>]*>\s*$/i.test(l)) { i++; continue; }

      // 独立成行的徽章图片（README 头部）：连续行合并为一个居中段落，
      // 观感对齐 GitHub 头图
      if (/^\s*!\[[^\]]*\]\([^)]+\)\s*$/.test(l)) {
        const imgs = [];
        while (i < lines.length && /^\s*!\[[^\]]*\]\([^)]+\)\s*$/.test(lines[i])) {
          imgs.push(inline(lines[i].trim())); i++;
        }
        out.push('<p style="text-align:center;margin:8px 0">' + imgs.join('') + '</p>');
        continue;
      }

      // <details>/<summary> 折叠块（README FAQ 用）：标签行原样输出
      // （inline() 的白名单会把转义还原成真标签），内部内容照常走块解析
      if (/^\s*<details[^>]*>\s*$/i.test(l) || /^\s*<\/details>\s*$/i.test(l) ||
          /^\s*<summary>.*<\/summary>\s*$/i.test(l)) {
        out.push(inline(l)); i++; continue;
      }

      // 空行
      if (!l.trim()) { i++; continue; }

      // 普通段落
      out.push('<p style="margin:6px 0">' + inline(l) + '</p>');
      i++;
    }

    document.getElementById('md').innerHTML = out.join('\n');
  })();
</script>
</body>
</html>
