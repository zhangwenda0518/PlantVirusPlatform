<!DOCTYPE html>
<html lang="{{ 'en' if lang == 'en' else 'zh-CN' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="vp-lang" content="{{ lang }}">
<title>{{ 'Plant Virus Analysis Platform' if lang == 'en' else '植物病毒分析平台' }}</title>
<script>try{if(localStorage.getItem("vp_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<link rel="stylesheet" href="/static/app.css?v={{ asset_v }}">
</head>
<body>
{% include "_nav.html" %}

<div class="page">
  <!-- 环境状态条：模块 / 工具 / 数据库 / 磁盘一览。
       数据异步取 /api/selfcheck（服务端进程内缓存），不阻塞首屏；
       请求失败或未就绪时整条隐藏，不打扰封面。 -->
  <div id="envStrip" class="env-strip" hidden>
    <span id="envStripBody"></span>
    <a href="/settings" data-i18n="hm.env.settings">设置与自检 ›</a>
  </div>

  <!-- 封面：平台名 + 科研定位句 + 工程口径行。
       2026-10-23 按需求移除「背景 / 方法 / 流程 / 意义」四张叙事卡与
       平台架构总览：前者是静态文案，后者与下方模块入口重复。
       2026-10-26 AI 对话卡与 MCP 控制台迁出（悬浮坞 + /mcp 页），
       一键全流程卡按 2026-10-11 的归档决定移除 —— 首页只留封面、
       数据库状态与最近样品，分析入口在各功能模块页。 -->
  <div class="hero cover">
    <div class="cover-txt">
      <h1 data-i18n="hm.heroTitle">植物病毒分析平台</h1>
      <!-- 主标题下的一句科研定位（口径：看见样本里的病毒世界） -->
      <p class="cover-lead" data-i18n="hm.heroLead">看见样本里的病毒世界。</p>
      <p data-i18n="hm.heroSub">发现、鉴定、定量、溯源植物 RNA 病毒——再低的丰度也看得见；从原始测序数据到可发表的基因组证据，一台 Windows 电脑完成。</p>
      <!-- 工程口径一行：本地化 / 内置库 / 13 步级联 / 默认离线 -->
      <p class="cover-eng" data-i18n="hm.heroEng">Windows 单机本地分析 · 内置病毒数据库 3.4 GB · 十余个功能模块全程离线</p>
    </div>
  </div>

  <!-- 数据库模块 -->
  <h2 class="sec" data-i18n="hm.dbSection">🗄 数据库模块</h2>
  <div class="module-grid" id="dbCards"><p class="hint" data-i18n="c.loading">加载中…</p></div>

  <!-- 常用工具 -->
  <div id="favSection" style="display:none">
    <h2 class="sec">⭐ <span data-i18n="fav.strip">常用工具</span></h2>
    <div id="favStrip" class="fav-strip"></div>
  </div>

  <!-- 最近样品 -->
  <h2 class="sec" data-i18n="hm.recentSection">🧪 最近样品</h2>
  <div id="homeSamples" class="module-grid"><p class="hint" data-i18n="c.loading">加载中…</p></div>
</div>

<!-- AI 助手对话坞已全局化：随 _nav.html 注入每个页面（2026-10-02），
     本页不再单独携带。事件流/快捷指令/闸门确认在任何页面都可用。 -->

<script src="/static/i18n.js?v={{ asset_v }}"></script>
<script src="/static/app.js?v={{ asset_v }}"></script>
  <script src="/static/app-compare.js?v={{ asset_v }}"></script>
  <script src="/static/app-runhistory.js?v={{ asset_v }}"></script>
  <script src="/static/app-jobs.js?v={{ asset_v }}"></script>
  <script src="/static/app-browse.js?v={{ asset_v }}"></script>
  <script src="/static/app-batch.js?v={{ asset_v }}"></script>
  <script src="/static/app-storage.js?v={{ asset_v }}"></script>
<script src="/static/examples.js?v={{ asset_v }}"></script>
<script>
/* 环境状态条：异步拉 /api/selfcheck（服务端缓存 5 分钟），渲染一行摘要。
   任何异常都静默——总览页不该因为自检挂掉而受影响。 */
(async () => {
  try {
    const d = await (await fetch('/api/selfcheck')).json();
    const sec = {};
    for (const s of (d.sections || [])) sec[s.id] = s;
    if (!sec.modules && !sec.tools) return;
    const bit = (label, val, state) =>   // state: ok / warn / bad
      `<span class="env-bit ${state}">${state === 'ok' ? '✔' : state === 'warn' ? '△' : '✘'} ` +
      `${esc(label)} <b>${esc(val)}</b></span>`;
    const disk = sec.disk && sec.disk.items && sec.disk.items[0];
    const tools = sec.tools || {};
    const nMiss = (tools.missing || []).length;
    const bits = [
      bit(t('hm.env.modules', '模块'),
          sec.modules ? trSc(sec.modules.summary) : '—',
          sec.modules && sec.modules.ok ? 'ok' : 'bad'),
      bit(t('hm.env.tools', '外部工具'),
          trSc(tools.summary || '—'),
          nMiss === 0 ? 'ok' : (tools.summary ? 'warn' : 'bad')),
      bit(t('hm.env.databases', '数据库'),
          sec.databases ? (sec.databases.ok ? t('hm.env.ready', '就绪') : t('hm.env.notReady', '未就绪')) : '—',
          sec.databases && sec.databases.ok ? 'ok' : 'bad'),
      bit(t('hm.env.disk', '磁盘'),
          disk ? trSc(disk.detail.replace(/^(剩余|free)\s*/, '')) : '—',
          disk ? (disk.ok ? 'ok' : 'warn') : 'ok'),
    ];
    $('envStripBody').innerHTML = bits.join('');
    $('envStrip').hidden = false;
  } catch (e) { /* 静默 */ }
})();
</script>
</body>
</html>
